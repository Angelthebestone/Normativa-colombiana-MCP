name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # SIN_RED salta las pruebas que consultan los portales oficiales: no tiene
      # sentido que cada push de cada fork golpee un servicio público. La suite
      # completa corre una vez por semana en portales.yml.
      - run: node --test test/smoke.ts test/e2e.ts
        env:
          SIN_RED: '1'
      - name: Empaquetar la extensión
        run: npx --yes @anthropic-ai/mcpb@latest pack . normativa-colombia.mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: normativa-colombia-mcpb
          path: normativa-colombia.mcpb
