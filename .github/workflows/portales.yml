name: Portales

# Corre la suite completa contra las fuentes oficiales. Sirve de alarma
# temprana: si el Gestor Normativo o la relatoría cambian su HTML, el canario
# salta aquí antes de que un usuario se encuentre con una respuesta vacía.
#
# Una vez por semana. Son servicios públicos y esto son unas pocas decenas de
# peticiones, al ritmo limitado del propio cliente.
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  contra-fuentes-reales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generar-indice
      - run: npm run build
      - run: node --test test/smoke.ts test/e2e.ts
      - name: Avisar si los portales cambiaron
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = 'Las pruebas contra los portales fallaron'
            const abiertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'portal-cambió',
            })
            if (abiertos.data.some((i) => i.title === titulo)) return
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: titulo,
              labels: ['portal-cambió'],
              body: [
                'La ejecución semanal contra las fuentes oficiales falló.',
                '',
                'Suele significar que el Gestor Normativo o la relatoría cambiaron su HTML.',
                'Revisa qué prueba cayó y qué dice el canario:',
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            })
